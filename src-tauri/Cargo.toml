[package]
name = "fast-comment"
version = "0.8.1"
description = "Fast multi-platform live chat viewer (Twitch / YouTube Live)"
edition = "2021"
rust-version = "1.90"

[lib]
name = "fast_comment_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
# 自動更新後の再起動(relaunch)
tauri-plugin-process = "2"
arboard = { version = "3", default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_path_to_error = "0.1"

tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures-util = "0.3"

# Twitch IRC over WebSocket
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

# YouTube InnerTube HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "stream"] }
oauth2 = { version = "5", default-features = false, features = ["reqwest"] }

# YouTube Data API liveChatMessages.streamList (official low-latency gRPC)
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
prost = "0.13"
# niconico NDGR メッセージサーバーの length-delimited Protobuf ストリーム読み
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# OBS overlay server
axum = { version = "0.7", features = ["ws"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
tower = { version = "0.5", features = ["util"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
url = "2"
subtle = "2"
getrandom = "0.2"
base64 = "0.22"

anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"

# Google OAuth refresh tokens are kept out of config.json and stored in the
# native OS credential store. Platform-specific features avoid shipping an
# unused cross-platform keyring backend.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust"] }

# 自動更新(GitHub Releases の latest.json を見る)。デスクトップのみ。
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
# 二重起動を防ぐ(2 つ目は既存ウィンドウを前面に出して終了)。最初に登録する。
tauri-plugin-single-instance = "2"

# API / integrations の受け入れテスト(tests/acceptance)用。
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"

# ビルド時間優先の release。fat LTO + codegen-units=1 は毎ビルド3分超かかる
# 割にサイズ数%しか稼げないため、thin LTO + 並列 + incremental にしている。
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16
incremental = true
panic = "abort"
strip = true
