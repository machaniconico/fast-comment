[package]
name = "fast-comment"
version = "0.1.0"
description = "Fast multi-platform live chat viewer (Twitch / YouTube Live)"
edition = "2021"
rust-version = "1.77"

[lib]
name = "fast_comment_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures-util = "0.3"

# Twitch IRC over WebSocket
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

# YouTube InnerTube HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "stream"] }
oauth2 = { version = "5", default-features = false, features = ["reqwest"] }

# YouTube Data API liveChatMessages.streamList (official low-latency gRPC)
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
prost = "0.13"
# niconico NDGR メッセージサーバーの length-delimited Protobuf ストリーム読み
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }

# OBS overlay server
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }

anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"

# Google OAuth refresh tokens are kept out of config.json and stored in the
# native OS credential store. Platform-specific features avoid shipping an
# unused cross-platform keyring backend.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
